name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campushub:campushub_local@localhost:5432/campushub_test?schema=public
      TEST_DATABASE_URL: postgresql://campushub:campushub_local@localhost:5432/campushub_test?schema=public
      JWT_ACCESS_SECRET: integration-test-jwt-secret-longer-than-32-characters
      ATTENDANCE_QR_SECRET: integration-test-attendance-secret-longer-than-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Start private MinIO test bucket
        env:
          S3_ACCESS_KEY_ID: campushub-test-user
          S3_SECRET_ACCESS_KEY: campushub-test-password
        run: |
          docker run -d --name campushub-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "MinIO did not become ready" >&2; exit 1; fi
            sleep 1
          done
          node -e "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3'); const c=new S3Client({endpoint:'http://127.0.0.1:9000',region:'us-east-1',forcePathStyle:true,credentials:{accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY}}); c.send(new CreateBucketCommand({Bucket:'campushub-test'})).catch(e=>{console.error(e);process.exitCode=1})"

      - name: PostgreSQL integration tests with S3 storage
        run: npm run test:integration
        env:
          STORAGE_DRIVER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: campushub-test
          S3_ACCESS_KEY_ID: campushub-test-user
          S3_SECRET_ACCESS_KEY: campushub-test-password
          S3_FORCE_PATH_STYLE: "true"

      - name: Seed E2E demo accounts
        run: npm run db:seed
        env:
          DEMO_PASSWORD: CampusHub-E2E-Demo-Password-2026

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e
        env:
          DEMO_PASSWORD: CampusHub-E2E-Demo-Password-2026
          CI: true
