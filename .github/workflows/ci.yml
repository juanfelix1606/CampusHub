name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campushub:campushub_local@localhost:5432/campushub_test?schema=public
      TEST_DATABASE_URL: postgresql://campushub:campushub_local@localhost:5432/campushub_test?schema=public
      JWT_ACCESS_SECRET: integration-test-jwt-secret-longer-than-32-characters
      ATTENDANCE_QR_SECRET: integration-test-attendance-secret-longer-than-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Start S3 HTTP test server
        env:
          S3_ACCESS_KEY_ID: campushub-test-user
          S3_BUCKET: campushub-test
        run: |
          ./node_modules/.bin/tsx apps/api/scripts/s3-test-server.ts > "$RUNNER_TEMP/s3-test-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat "$RUNNER_TEMP/s3-test-server.log" >&2; exit 1; fi
            sleep 1
          done

      - name: PostgreSQL integration tests with S3 storage
        run: npm run test:integration
        env:
          STORAGE_DRIVER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: campushub-test
          S3_ACCESS_KEY_ID: campushub-test-user
          S3_SECRET_ACCESS_KEY: campushub-test-password
          S3_FORCE_PATH_STYLE: "true"

      - name: Seed E2E demo accounts
        run: npm run db:seed
        env:
          DEMO_PASSWORD: CampusHub-E2E-Demo-Password-2026

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e
        env:
          DEMO_PASSWORD: CampusHub-E2E-Demo-Password-2026
          CI: true
