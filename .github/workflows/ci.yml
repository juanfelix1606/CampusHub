name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campushub:campushub_local@localhost:5432/campushub_test?schema=public
      TEST_DATABASE_URL: postgresql://campushub:campushub_local@localhost:5432/campushub_test?schema=public
      JWT_ACCESS_SECRET: integration-test-jwt-secret-longer-than-32-characters
      ATTENDANCE_QR_SECRET: integration-test-attendance-secret-longer-than-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (when configured)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL integration tests
        run: npm run test:integration
