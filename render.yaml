services:
  - type: web
    name: campushub-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace @campushub/api
    startCommand: npm run start --workspace @campushub/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: ATTENDANCE_QR_SECRET
        sync: false
      - key: ORIGIN_PROXY_SECRET
        sync: false
      - key: PROXY_HOPS
        value: "2"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
