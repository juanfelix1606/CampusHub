services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campushub}
      POSTGRES_USER: ${POSTGRES_USER:-campushub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campushub_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campushub} -d ${POSTGRES_DB:-campushub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: campushub_test
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: campushub_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushub -d campushub_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
